name: mikee_admin
description: Mikee reception robot admin control app - Flutter web + iOS + Android
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter

  # Auth + database + realtime
  supabase_flutter: ^2.5.0

  # WebSocket for spine connection
  web_socket_channel: ^2.4.0

  # Streamed HTTP GET for the mobile/desktop MJPEG camera parser
  http: ^1.2.0
  url_launcher: ^6.3.0 # open/play recorded clips in the browser's native player

  # Image picker for camera/gallery
  image_picker: ^1.0.0

  # Camera + live preview (mobile)
  camera: ^0.10.0

  # Face detection (mobile) - on-device ML Kit
  google_mlkit_face_detection: ^0.10.0

  # Routing with auth guard
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Image caching for gallery
  cached_network_image: ^3.3.0

  # Local storage
  shared_preferences: ^2.2.3

  # Fonts
  google_fonts: ^6.1.0

  # Immutable state models
  freezed_annotation: ^2.4.0

  # Push notifications (#90 Part B). Dormant until Firebase config is added
  # (android/app/google-services.json); main() guards init so the app runs
  # without it. firebase_core + firebase_messaging are the minimal FCM client.
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  # Assets (if needed later)
  # assets:
  #   - assets/
