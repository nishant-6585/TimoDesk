name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test --coverage || true   # non-fatal until test suite is established

      - name: Build debug APK
        run: |
          flutter build apk \
            --flavor robot \
            --debug \
            --no-shrink \
            -t lib/main.dart

      - name: Upload debug APK
        # Only keep artifacts for main-branch pushes (skip PRs/develop), never fail
        # the job on upload — the build already passed; storage quota is not a code issue.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mikee-debug-${{ github.sha }}
          path: robot_app/build/app/outputs/flutter-apk/app-robot-debug.apk
          retention-days: 3
          overwrite: true
