plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.mikee.robotapp"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.mikee.robotapp"
        minSdk = 25
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "env"
    productFlavors {
        robot {
            dimension "env"
            // robot-core / nav server address — same one Alpha Map connects to
            // (its offline-login screen shows IP 192.168.99.2, port 1445; the head
            // reaches it over eth1). The SDK's 127.0.0.1:60002 default was wrong —
            // robot-core isn't on the head's localhost, it's the chassis board.
            buildConfigField "String", "SDK_IP",   '"192.168.99.2"'
            buildConfigField "int",    "SDK_PORT",  '1445'
            resValue "string", "app_name", "Mikee Robot"
        }
        remote {
            dimension "env"
            buildConfigField "String", "SDK_IP",   '"192.168.99.101"'
            buildConfigField "int",    "SDK_PORT",  '60002'
            resValue "string", "app_name", "Mikee Remote"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    // CsjRobot SDK — bundled AAR (source lives at Timo/SdkDemoCsj/newSceneSDK locally)
    implementation files('../libs/newSceneSDK-release.aar')
    // Netty — REQUIRED by the SDK's socket transport (HandlerMsgSocketService →
    // CosClientAgent, the Netty cos client that connects to robot-core, the same
    // path Alpha Map uses). The AAR doesn't bundle it and it was dropped when the
    // SDK was converted from a project module to a bundled AAR, so the SDK silently
    // couldn't reach robot-core (no battery/person/nav callbacks; socket mode
    // crashed with ClassNotFoundException io.netty…). Version matches the vendor
    // demo (Timo/SdkDemoCsj/app/build.gradle).
    implementation 'io.netty:netty-all:4.1.23.Final'
    // Transitive deps the SDK needs (not bundled in the AAR)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.code.gson:gson:2.8.1'
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.42.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'io.getstream:stream-webrtc-android:1.1.0'
    // Exclude slf4j-api — newSceneSDK already bundles slf4j-api-1.7.21.jar
    implementation ('org.java-websocket:Java-WebSocket:1.5.3') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

flutter {
    source = "../.."
}
