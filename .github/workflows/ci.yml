name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test --coverage || true   # non-fatal until test suite is established

      - name: Build debug APK
        run: |
          flutter build apk \
            --flavor robot \
            --debug \
            --no-shrink \
            -t lib/main.dart

      - name: Upload debug APK
        # Only keep artifacts for main-branch pushes (skip PRs/develop), never fail
        # the job on upload — the build already passed; storage quota is not a code issue.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mikee-debug-${{ github.sha }}
          path: robot_app/build/app/outputs/flutter-apk/app-robot-debug.apk
          retention-days: 3
          overwrite: true

  # The admin app was never in CI — only robot_app was, which is how an analyzer
  # ERROR sat in app/test/widget_test.dart without anyone noticing.
  admin-app:
    name: Admin App — Analyze, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ERRORS are the gate. The app still carries ~250 pre-existing INFO lints
      # (withOpacity deprecations, avoid_print, dart:html) — and unlike `dart
      # analyze`, `flutter analyze` treats infos as fatal BY DEFAULT, so both
      # flags are required for an errors-only gate. Warnings were cleared
      # 2026-08-06; clear the infos, then drop --no-fatal-infos.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Fatal, deliberately. All three suites are deterministic unit tests, so a
      # red result here means something is actually broken. (robot_app's step is
      # still `|| true` — same treatment once its suite is trusted.)
      - name: Run tests
        run: flutter test

      # Builds the shipping configuration: FLAVOR=prod is the login-gated one.
      # Passing it explicitly means CI fails if that default ever regresses.
      - name: Build web
        run: flutter build web --dart-define=FLAVOR=prod
