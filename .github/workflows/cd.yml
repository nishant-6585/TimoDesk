name: CD — Release APK

on:
  push:
    tags:
      - "v*"           # Trigger: git tag v1.2.3 && git push --tags
  workflow_dispatch:   # Manual trigger from GitHub UI
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.3)"
        required: true
        default: "1.0.0"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Release

    defaults:
      run:
        working-directory: robot_app

    # `secrets` is not a valid context in step-level `if:` expressions, so the
    # signing secrets are surfaced as env vars, which `if:` can read.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mikee-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=mikee-release.keystore
          EOF

      - name: Build release APK (signed if keystore present)
        run: |
          flutter build apk \
            --flavor robot \
            --release \
            --build-name=${{ env.VERSION }} \
            --build-number=${{ github.run_number }} \
            -t lib/main.dart

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-robot-release.apk \
             ../dist/mikee-v${{ env.VERSION }}-robot.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', env.VERSION) || github.ref_name }}
          name: "Mikee v${{ env.VERSION }}"
          body: |
            ## Mikee v${{ env.VERSION }}

            ### Installation
            1. Download `mikee-v${{ env.VERSION }}-robot.apk`
            2. Transfer to Mikee robot: `adb install -r mikee-v${{ env.VERSION }}-robot.apk`
            3. Or side-load via the robot's browser

            **Commit:** ${{ github.sha }}
            **Build number:** ${{ github.run_number }}
          files: dist/mikee-v${{ env.VERSION }}-robot.apk
          draft: false
          prerelease: false
